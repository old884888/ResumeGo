<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='22' height='26' rx='4' fill='%230A84FF'/%3E%3Crect x='10' y='9' width='12' height='2.4' rx='1.2' fill='white'/%3E%3Crect x='10' y='14.5' width='12' height='2.4' rx='1.2' fill='white' opacity='.75'/%3E%3Crect x='10' y='20' width='7' height='2.4' rx='1.2' fill='white' opacity='.5'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="简白 JianBai — 本地简历工坊：免费、无水印、数据不出本机" />
    <title>简白 · 本地简历工坊</title>
  </head>
  <body>
    <div id="app">
      <!-- Vue 挂载前的启动占位：IndexedDB 初始化期间避免白屏 -->
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-mark"></div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <style>
      #boot-splash-style {
        display: none;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f5f7;
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .boot-splash {
          background: #1c1c1e;
        }
      }
      .boot-mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #0a84ff, #5ac8fa);
        box-shadow: 0 6px 20px rgba(10, 132, 255, 0.35);
        animation: boot-float 1.6s ease-in-out infinite;
      }
      .boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: rgba(120, 120, 128, 0.22);
        overflow: hidden;
      }
      .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #0a84ff;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
